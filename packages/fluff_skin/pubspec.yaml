name: fluff_skin
description: >-
  Theme + design-token bridge for Fluff. Wraps the wloom design system
  (wolwoloom) where it's available, otherwise ships a self-contained
  Material 3 theme with the same tokens so the rest of the app never
  depends on which renderer is underneath.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
