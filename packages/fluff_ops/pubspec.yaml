name: fluff_ops
description: >-
  Pure-Dart operation engine for Fluff: queued copy / move / delete /
  rename / hash with progress reporting and conflict policies. Runs on
  any platform; the foreground-task wire-up lives in the app.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.5

dependencies:
  meta: ^1.16.0
  fluff_vfs:
    path: ../fluff_vfs

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
