name: fluff_archive
description: >-
  Archive viewing for Fluff. Wraps the `archive` package to expose a
  read-only ArchiveFsProvider that lets BrowseScreen treat a zip / tar /
  tar.gz file as if it were a directory tree. Phase 5 web slice; write
  support + 7z / RAR / zstd via libarchive land in Phase 5.1.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.5

dependencies:
  archive: ^4.0.0
  meta: ^1.16.0
  fluff_vfs:
    path: ../fluff_vfs

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
