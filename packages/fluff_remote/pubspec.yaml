name: fluff_remote
description: >-
  Remote account model + FsProvider implementations for SMB / SFTP.
  The Phase 4 web slice ships an in-memory MockRemoteFsProvider so the
  account flow can be exercised end-to-end without a real network
  connection; the real SmbFsProvider (smb_connect) and SftpFsProvider
  (dartssh2) land in the Phase 4.1 Android slice.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.5

dependencies:
  meta: ^1.16.0
  fluff_vfs:
    path: ../fluff_vfs

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
