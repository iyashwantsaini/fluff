name: Build and Release (APKs)

# Triggers:
#   - push of any tag starting with `v` (e.g. `v0.1.3`) -> publishes a release
#   - manual dispatch -> builds without publishing
#
# Builds:
#   - app/ Android - split-per-abi + universal APKs (signed)
#
# APKs are signed with the debug key by default. To get upgrade-compatible
# signed APKs, set these repo secrets (already configured for this repo):
#   KEYSTORE_BASE64
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Optional release notes (Markdown). Leave empty to auto-generate."
        required: false
        default: ""

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Derive release version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep '^version:' app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          fi
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # -- Optional release signing -------------------------------
      - name: Detect keystore secret
        run: |
          if [[ -n "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "HAVE_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAVE_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "::warning::KEYSTORE_BASE64 not set - APKs will be signed with the debug key (not upgrade-compatible)."
          fi

      - name: Decode signing keystore
        if: ${{ env.HAVE_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app/android
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/fluff-release.keystore
          cat > app/android/key.properties <<EOF
          storeFile=fluff-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # -- Build --------------------------------------------------
      - name: Build APKs (split + universal)
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      # -- Collect & rename ---------------------------------------
      - name: Collect APKs
        run: |
          V=${{ steps.version.outputs.version }}
          mkdir -p release-apks
          OUT=app/build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [[ -f "$OUT/app-$abi-release.apk" ]]; then
              cp "$OUT/app-$abi-release.apk" "release-apks/fluff-v${V}-${abi}.apk"
            fi
          done
          if [[ -f "$OUT/app-release.apk" ]]; then
            cp "$OUT/app-release.apk" "release-apks/fluff-v${V}-universal.apk"
          fi
          ls -la release-apks/

      # -- Release notes ------------------------------------------
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ -n "${{ github.event.inputs.release_notes }}" ]]; then
            echo "${{ github.event.inputs.release_notes }}" > release-notes.md
          else
            LAST_TAG=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || echo "")
            {
              echo "## Fluff v${{ steps.version.outputs.version }}"
              echo ""
              echo "A pure-Flutter Android file manager - no telemetry, no native app code."
              echo ""
              if [[ -n "$LAST_TAG" ]]; then
                echo "### Changes since \`$LAST_TAG\`"
                echo ""
                git log "${LAST_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges -30
              else
                echo "### Recent commits"
                echo ""
                git log --pretty=format:"- %s (%h)" --no-merges -30
              fi
              echo ""
              echo ""
              echo "### Install"
              echo ""
              echo "- **\`fluff-v*-arm64-v8a.apk\`** - recommended for nearly every modern phone."
              echo "- **\`fluff-v*-armeabi-v7a.apk\`** - older 32-bit devices."
              echo "- **\`fluff-v*-x86_64.apk\`** - x86_64 emulators and Chromebooks."
              echo "- **\`fluff-v*-universal.apk\`** - works on any architecture (larger)."
            } > release-notes.md
          fi
          cat release-notes.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluff-v${{ steps.version.outputs.version }}-apks
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" release-apks/*.apk --clobber
            gh release edit   "v$V" --notes-file release-notes.md --draft=false --latest
          else
            gh release create "v$V" release-apks/*.apk \
              --title "Fluff v$V" \
              --notes-file release-notes.md \
              --latest
          fi
