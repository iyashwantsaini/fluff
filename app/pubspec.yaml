name: fluff
description: "Fluff — a pure-Flutter Android file manager."
publish_to: 'none'
version: 0.4.0+7

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  fluff_vfs:
    path: ../packages/fluff_vfs
  fluff_skin:
    path: ../packages/fluff_skin
  fluff_ops:
    path: ../packages/fluff_ops
  fluff_vault:
    path: ../packages/fluff_vault
  fluff_remote:
    path: ../packages/fluff_remote
  fluff_archive:
    path: ../packages/fluff_archive
  fluff_share:
    path: ../packages/fluff_share
  fluff_sync:
    path: ../packages/fluff_sync
  fluff_intel:
    path: ../packages/fluff_intel
  archive: ^4.0.0
  flutter_markdown: ^0.7.4
  flutter_svg: ^2.0.10
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  just_audio: ^0.9.42
  video_player: ^2.9.2
  chewie: ^1.8.5
  pdfx: ^2.6.0
  flutter_html: ^3.0.0-beta.2
  share_plus: ^10.1.2
  open_filex: ^4.5.0
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "../assets/icon/fluff_icon_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4F378B"
  adaptive_icon_foreground: "../assets/icon/fluff_icon_1024.png"

flutter:
  uses-material-design: true
